name: 1 · Buscar tipos de prenda
on:
  schedule:
    - cron: '0 7 * * 1'   # una vez por semana (lunes 04:00 Argentina) por si la tienda agrega categorías
  workflow_dispatch:       # "Run workflow" = Buscar tipos de prenda ahora
permissions:
  contents: write
concurrency:
  group: sync-categorias
  cancel-in-progress: false
jobs:
  categorias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scraper/sync.js categorias
        continue-on-error: true
      - name: Guardar cambios
        run: |
          git config user.name "catalogo-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/categories.json
          git diff --cached --quiet || (git commit -m "Tipos de prenda actualizados" && git pull --rebase && git push)
