name: 2 · Cargar catálogo de lo seleccionado
on:
  workflow_dispatch:       # SOLO MANUAL (sin programación automática): "Run workflow" = Cargar / Actualizar ahora
    inputs:
      seleccion:
        description: 'Pegá acá la selección copiada del tablero (botón "Copiar selección"). Vacío = usa la última guardada.'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: sync-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scraper/sync.js catalogo
        continue-on-error: true
        env:
          SELECCION: ${{ inputs.seleccion }}
      - name: Guardar cambios
        run: |
          git config user.name "catalogo-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Catálogo actualizado" && git pull --rebase && git push)
